name: Build Sovereign AI Node (Windows / macOS / Linux / Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'SovereignAI-Node'

jobs:
  build:
    strategy:
      # fail-fast: false يعني لو فشل بناء منصة واحدة (مثلاً Windows)، الاثنتان
      # الأخريان يكملان بناءهما بدل ما يتوقف كل شيء فوراً. مفيد جداً بما أن
      # Windows وmacOS لم يُختبرا محلياً بعد وقد يحتاجان تصحيحات لاحقة.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_ext: tar.gz
          - os: windows-2022
            platform: windows
            artifact_ext: zip
          - os: macos-13
            platform: macos
            artifact_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ===================================================
      # اعتماديات نظام التشغيل — تختلف جذرياً بين المنصات لأن
      # pywebview يستخدم backend مختلف تماماً على كل نظام:
      # Linux → GTK/WebKit2GTK (يحتاج مكتبات نظام صريحة)
      # Windows → Edge WebView2 (غالباً مثبّت مسبقاً على runner)
      # macOS → WebKit الأصلي لنظام macOS (لا يحتاج تثبيت إضافي)
      # ===================================================
      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev libgtk-3-0 libwebkit2gtk-4.1-0 \
            libjpeg-dev zlib1g-dev libpng-dev libsqlite3-dev libssl-dev libffi-dev \
            pkg-config build-essential curl wget

      - name: Ensure WebView2 Runtime Reference (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "WebView2 Runtime is preinstalled on windows-2022 GitHub runners."
          echo "pywebview will use it automatically as the Windows backend; no extra install needed here."

      - name: Install System Dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          echo "macOS uses the native system WebKit via pywebview; no extra system packages required."

      # ===================================================
      # اعتماديات Python — نفس requirements.txt للثلاثة، لكن نضيف
      # حزمة pywebview[qt] فقط على Linux لأنها المطلوبة هناك تحديداً
      # (على Windows/macOS pywebview يستخدم backend النظام الأصلي مباشرة)
      # ===================================================
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install --upgrade setuptools

      # ===================================================
      # تحميل ملفات الواجهة الثابتة (offline assets) — نفس الخطوة
      # للثلاثة، لضمان عمل التطبيق دون إنترنت بعد التثبيت.
      # نستخدم curl على الثلاثة (متوفر افتراضياً على كل GitHub runners،
      # بما فيها windows-2022 عبر curl.exe المدمج).
      # ===================================================
      - name: Download Static Files (Offline CSS/JS/Fonts)
        shell: bash
        run: |
          echo "Creating static directory and downloading UI files..."
          mkdir -p static

          curl -s -L -o static/tailwind.min.js https://cdn.tailwindcss.com

          # ملاحظة مهمة: لا نحمّل CSS جاهزاً من fonts.googleapis.com، لأن ذلك
          # الملف يحتوي على @font-face يشاور بدوره على fonts.gstatic.com —
          # أي أن الأيقونات تحتاج إنترنت وقت التشغيل رغم أننا "حمّلنا" شيئاً
          # وقت البناء. هذا يناقض مبدأ العمل بدون إنترنت (Offline) للتطبيق.
          # الحل: نحمّل ملف الخط الفعلي (.woff2) من مستودع Google الرسمي على
          # GitHub، ونكتب ملف CSS محلياً بأنفسنا يشير لمسار محلي فقط.
          curl -s -L -o "static/material-symbols-rounded.woff2" \
            "https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.woff2"

          cat > static/material-symbols-rounded.css << 'EOF'
          @font-face {
            font-family: 'Material Symbols Rounded';
            font-style: normal;
            font-weight: 100 700;
            src: url('material-symbols-rounded.woff2') format('woff2');
          }
          .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'liga';
          }
          EOF

          # فحص أساسي: تأكيد أن ملف الخط فعلاً تحمّل بحجم معقول (ليس صفحة خطأ HTML صغيرة)
          FONT_SIZE=$(stat -c%s "static/material-symbols-rounded.woff2" 2>/dev/null || stat -f%z "static/material-symbols-rounded.woff2")
          echo "Downloaded font file size: ${FONT_SIZE} bytes"
          if [ "$FONT_SIZE" -lt 10000 ]; then
            echo "::warning::Font file size looks too small (${FONT_SIZE} bytes) - download may have failed silently. Icons may not render correctly."
          fi

      # ===================================================
      # بناء الملف التنفيذي — الفروقات الجوهرية بين المنصات:
      # 1. فاصل --add-data: ":" على Linux/macOS، ";" على Windows
      # 2. صيغة الأيقونة: .png (Linux) / .ico (Windows) / .icns (macOS)
      # 3. --collect-all PyQt5/PyQtWebEngine/qtpy فقط على Linux
      #    (هذه حزم backend خاصة بـ GTK/Qt، غير مستخدَمة على Windows/macOS
      #    حيث يستخدم pywebview الـ WebView الأصلي للنظام مباشرة)
      # ===================================================
      - name: Build Single Executable File (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="${{ env.APP_NAME }}" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "app_icon.png:." \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all pydantic \
            --collect-all httpx \
            --collect-all pywebview \
            --collect-all PyQt5 \
            --collect-all PyQtWebEngine \
            --collect-all qtpy \
            --collect-all chromadb \
            --collect-all tqdm \
            --collect-all jinja2 \
            --collect-all jaraco \
            --collect-all zeroconf \
            --collect-submodules pkg_resources \
            --hidden-import=network_sync \
            --hidden-import=zeroconf \
            --collect-submodules zeroconf \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --icon="app_icon.png" app.py

      - name: Build Single Executable File (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="%APP_NAME%" ^
            --add-data "templates;templates" ^
            --add-data "static;static" ^
            --add-data "app_icon.png;." ^
            --collect-all fastapi ^
            --collect-all uvicorn ^
            --collect-all pydantic ^
            --collect-all httpx ^
            --collect-all pywebview ^
            --collect-all chromadb ^
            --collect-all tqdm ^
            --collect-all jinja2 ^
            --collect-all jaraco ^
            --collect-all zeroconf ^
            --collect-submodules pkg_resources ^
            --hidden-import=network_sync ^
            --hidden-import=zeroconf ^
            --collect-submodules zeroconf ^
            --hidden-import=uvicorn.logging ^
            --hidden-import=uvicorn.loops ^
            --hidden-import=uvicorn.loops.auto ^
            --hidden-import=uvicorn.protocols ^
            --hidden-import=uvicorn.protocols.http ^
            --hidden-import=uvicorn.protocols.http.auto ^
            --hidden-import=uvicorn.protocols.websockets ^
            --hidden-import=uvicorn.protocols.websockets.auto ^
            --hidden-import=uvicorn.lifespan ^
            --hidden-import=uvicorn.lifespan.on ^
            --icon="app_icon.ico" app.py

      - name: Build Single Executable File (macOS)
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="${{ env.APP_NAME }}" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "app_icon.png:." \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all pydantic \
            --collect-all httpx \
            --collect-all pywebview \
            --collect-all chromadb \
            --collect-all tqdm \
            --collect-all jinja2 \
            --collect-all jaraco \
            --collect-all zeroconf \
            --collect-submodules pkg_resources \
            --hidden-import=network_sync \
            --hidden-import=zeroconf \
            --collect-submodules zeroconf \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --icon="app_icon.icns" app.py

      # ===================================================
      # فحص سلامة الملف التنفيذي (Sanity Check) — لكل منصة على
      # runner الخاص بها فوراً بعد البناء. هذا لا يشغّل نافذة GUI
      # فعلية (pywebview يحتاج شاشة/عرض غير متوفر على CI runner)،
      # لكنه يتأكد أن الملف:
      # 1. تكوّن فعلاً وموجود بالمسار المتوقع
      # 2. حجمه معقول (ليس فارغاً أو تالفاً من فشل صامت بالبناء)
      # 3. نوعه الحقيقي صحيح (PE32+ لويندوز، Mach-O لماك، ELF للينكس)
      # لو أي فحص فشل، الخطوة توقف الـ workflow بخطأ بدل ما ترفع
      # ملف تالف كـ "ناجح" بدون تنبيه.
      # ===================================================
      - name: Sanity Check Executable (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          FILE_PATH="dist/${{ env.APP_NAME }}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "::error::Executable not found at $FILE_PATH"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "Executable size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "::error::Executable size looks too small (${FILE_SIZE} bytes) — build may have failed silently."
            exit 1
          fi
          file "$FILE_PATH"
          file "$FILE_PATH" | grep -qi "ELF" || { echo "::error::File is not a valid ELF executable"; exit 1; }
          chmod +x "$FILE_PATH"
          echo "✅ Linux executable passed sanity checks."

      - name: Sanity Check Executable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $FilePath = "dist\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $FilePath)) {
            Write-Host "::error::Executable not found at $FilePath"
            exit 1
          }
          $FileSize = (Get-Item $FilePath).Length
          Write-Host "Executable size: $FileSize bytes"
          if ($FileSize -lt 10000000) {
            Write-Host "::error::Executable size looks too small ($FileSize bytes) — build may have failed silently."
            exit 1
          }
          # تحقق من رأس ملف PE (يبدأ بـ 'MZ') للتأكد أنه ملف Windows تنفيذي صحيح
          $bytes = [System.IO.File]::ReadAllBytes($FilePath)[0..1]
          $header = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($header -ne "MZ") {
            Write-Host "::error::File does not have a valid PE (MZ) header — not a valid Windows executable."
            exit 1
          }
          Write-Host "✅ Windows executable passed sanity checks."

      - name: Sanity Check Executable (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          FILE_PATH="dist/${{ env.APP_NAME }}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "::error::Executable not found at $FILE_PATH"
            exit 1
          fi
          FILE_SIZE=$(stat -f%z "$FILE_PATH")
          echo "Executable size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "::error::Executable size looks too small (${FILE_SIZE} bytes) — build may have failed silently."
            exit 1
          fi
          file "$FILE_PATH"
          file "$FILE_PATH" | grep -qi "Mach-O" || { echo "::error::File is not a valid Mach-O executable"; exit 1; }
          chmod +x "$FILE_PATH"
          echo "✅ macOS executable passed sanity checks."

      # ===================================================
      # اختصار سطح المكتب — Linux فقط.
      #
      # ملاحظة إصلاح مهمة: النسخة السابقة استخدمت "%k" في حقول Exec/Icon،
      # وهذا متغيّر قديم جداً (من مواصفة KDE 1.x) وغير مدعوم إطلاقاً بمواصفة
      # freedesktop.org الحديثة التي تعتمدها GNOME/Nautilus اليوم. النتيجة:
      # "dirname %k" يفشل بصمت ويرجع قيمة فارغة، فيسقط تحميل الأيقونة تماماً
      # ويظهر النظام الأيقونة الافتراضية بدلاً من app_icon.png الحقيقية.
      #
      # الحل: بدل الاعتماد على مسار نسبي متحرك غير موثوق، ننشئ سكربت تثبيت
      # install.sh يُشغَّل مرة واحدة من قبل المستخدم بعد فك الضغط. هذا
      # السكربت ينسخ التطبيق والأيقونة إلى مسار ثابت ومعروف مسبقاً
      # (~/.local/share/sovereignai-node/) ثم يكتب ملف .desktop يشير
      # إلى ذلك المسار الثابت بشكل مطلق ونهائي — فتضمن ظهور الأيقونة
      # الصحيحة في كل من شريط المهام والنافذة بعد أول تشغيل.
      # ===================================================
      - name: Create Linux Desktop Shortcut + Installer Script
        if: matrix.platform == 'linux'
        run: |
          cat <<'EOF' > dist/install.sh
          #!/bin/bash
          # سكربت تثبيت لمرة واحدة: ينسخ التطبيق لمسار ثابت وينشئ اختصار
          # سطح مكتب صحيح (يحل مشكلة الأيقونة التي لا تظهر مع "%k").
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          INSTALL_DIR="$HOME/.local/share/sovereignai-node"
          DESKTOP_DIR="$HOME/.local/share/applications"

          mkdir -p "$INSTALL_DIR"
          mkdir -p "$DESKTOP_DIR"

          cp "$SCRIPT_DIR/SovereignAI-Node" "$INSTALL_DIR/"
          cp "$SCRIPT_DIR/app_icon.png" "$INSTALL_DIR/"
          chmod +x "$INSTALL_DIR/SovereignAI-Node"

          cat > "$DESKTOP_DIR/SovereignAI.desktop" <<DESKTOP
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Sovereign AI Node
          Comment=Sovereign AI Enterprise Local Node
          Exec=env QT_XCB_GL_INTEGRATION=none LIBGL_ALWAYS_SOFTWARE=1 $INSTALL_DIR/SovereignAI-Node
          Icon=$INSTALL_DIR/app_icon.png
          Terminal=false
          Categories=Development;Science;IDE;
          DESKTOP

          chmod +x "$DESKTOP_DIR/SovereignAI.desktop"
          gio set "$DESKTOP_DIR/SovereignAI.desktop" metadata::trusted true 2>/dev/null || true

          # تحديث قاعدة بيانات قوائم التطبيقات (تظهر بقائمة تطبيقات النظام أيضاً)
          update-desktop-database "$DESKTOP_DIR" 2>/dev/null || true

          echo ""
          echo "تم التثبيت بنجاح! ستجد Sovereign AI Node في قائمة التطبيقات،"
          echo "ويمكنك أيضاً تشغيله من سطح المكتب إن نسخت الاختصار يدوياً."
          EOF
          chmod +x dist/install.sh
          cp app_icon.png dist/ || true

      # ===================================================
      # تجهيز حزمة macOS: نسخ الأيقونة للأرشيف (مفيدة كمرجع بصري
      # للمستخدم حتى لو التطبيق onefile ولا ينشئ حزمة .app كاملة)
      # ===================================================
      - name: Prepare macOS Package Contents
        if: matrix.platform == 'macos'
        run: |
          cp app_icon.icns dist/ || true
          cp app_icon.png dist/ || true

      - name: Prepare Windows Package Contents
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          copy app_icon.ico dist\ 2>nul || exit 0
          copy app_icon.png dist\ 2>nul || exit 0

      # ===================================================
      # ضغط الناتج — tar.gz على Linux (يحافظ على صلاحيات chmod +x)،
      # zip على Windows/macOS (الصيغة الأكثر ألفة للمستخدمين هناك)
      # ===================================================
      - name: Archive Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czvf ${{ env.APP_NAME }}-linux.tar.gz ${{ env.APP_NAME }} install.sh app_icon.png

      - name: Archive Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ env.APP_NAME }}-windows.zip"

      - name: Archive Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          zip -r "../${{ env.APP_NAME }}-macos.zip" .

      - name: Upload Artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: dist/${{ env.APP_NAME }}-linux.tar.gz

      - name: Upload Artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: ${{ env.APP_NAME }}-windows.zip

      - name: Upload Artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos
          path: ${{ env.APP_NAME }}-macos.zip
